<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BANE Route Planner V2</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#10141b;
    color:#f4f6f8;
}

button,input,select,textarea{
    font-family:inherit;
}

.topbar{
    min-height:70px;
    background:#171d26;
    border-bottom:1px solid #303845;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 22px;
    gap:15px;
}

.logo{
    font-size:24px;
    font-weight:800;
    white-space:nowrap;
}

.logo span{
    color:#4da3ff;
}

.top-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.btn{
    border:0;
    border-radius:8px;
    padding:10px 15px;
    cursor:pointer;
    font-weight:700;
    color:white;
    background:#303946;
}

.btn:hover{
    filter:brightness(1.12);
}

.btn-blue{
    background:#1677ff;
}

.btn-green{
    background:#159957;
}

.btn-red{
    background:#d64545;
}

.btn-orange{
    background:#d98b17;
}

/* ==========================================
   STRANICE
========================================== */

.page{
    display:none;
}

.page.active{
    display:block;
}

#routePage.active{
    display:block;
}

#driversPage.active{
    display:block;
}

/* ==========================================
   ROUTE PLANNER
========================================== */

.layout{
    display:grid;
    grid-template-columns:330px 1fr;
    min-height:calc(100vh - 70px);
}

.sidebar{
    background:#151a22;
    border-right:1px solid #303845;
}

.sidebar-header{
    padding:18px;
    border-bottom:1px solid #303845;
}

.sidebar-title{
    font-size:18px;
    font-weight:800;
    margin-bottom:12px;
}

.search{
    width:100%;
    background:#0e1218;
    color:white;
    border:1px solid #394352;
    border-radius:8px;
    padding:11px;
    outline:none;
}

.driver-list{
    padding:10px;
}

.driver{
    padding:14px;
    margin-bottom:8px;
    background:#202732;
    border:1px solid #303946;
    border-radius:10px;
    cursor:pointer;
    position:relative;
}

.driver:hover{
    background:#27303d;
}

.driver.active{
    border-color:#1677ff;
    background:#1c3554;
}

.driver-name{
    font-weight:800;
    font-size:16px;
    padding-right:70px;
}

.driver-truck{
    color:#9ba7b6;
    font-size:13px;
    margin-top:4px;
}

.driver-routes{
    float:right;
    background:#1677ff;
    border-radius:20px;
    padding:3px 8px;
    font-size:12px;
    margin-left:5px;
}

.driver-tools{
    position:absolute;
    top:10px;
    right:10px;
    display:flex;
    gap:4px;
}

.driver-tool{
    width:27px;
    height:27px;
    border:0;
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:white;
    font-size:14px;
    padding:0;
}

.driver-edit{
    background:#303946;
}

.driver-edit:hover{
    background:#1677ff;
}

.driver-delete{
    background:#5a2929;
}

.driver-delete:hover{
    background:#d64545;
}

/* ==========================================
   STATUS VOZAČA
========================================== */

.driver-status{
    display:inline-block;
    margin-top:8px;
    padding:4px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:800;
}

.driver-status-vozi{
    background:#14532d;
    color:#dcfce7;
}

.driver-status-ceka{
    background:#713f12;
    color:#fef3c7;
}

.driver-status-utovar{
    background:#164e63;
    color:#cffafe;
}

.driver-status-istovar{
    background:#7c2d12;
    color:#ffedd5;
}

.driver-status-pauza{
    background:#7f1d1d;
    color:#fee2e2;
}

.driver-status-slobodan{
    background:#334155;
    color:#e2e8f0;
}

.driver-status-godisnji{
    background:#581c87;
    color:#f3e8ff;
}

.status-select{
    font-weight:700;
}

.main{
    padding:22px;
    overflow:auto;
}

.empty{
    min-height:500px;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#778292;
    font-size:18px;
    text-align:center;
}

.selected-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.selected-title{
    font-size:25px;
    font-weight:800;
}

.selected-subtitle{
    color:#8f9aaa;
    margin-top:5px;
}

.route-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(430px,1fr));
    gap:16px;
}

.route-card{
    background:#181e27;
    border:1px solid #303845;
    border-radius:13px;
    overflow:hidden;
}

.route-head{
    padding:15px;
    background:#202732;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.route-title{
    font-weight:800;
}

.status{
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:800;
}

.status-planiran{
    background:#334155;
    color:#dbeafe;
}

.status-toku{
    background:#164e63;
    color:#cffafe;
}

.status-problem{
    background:#7f1d1d;
    color:#fee2e2;
}

.status-zavrsen{
    background:#14532d;
    color:#dcfce7;
}

.route-body{
    padding:16px;
}

.location{
    padding:13px;
    background:#11161d;
    border-radius:9px;
    margin-bottom:8px;
}

.location-label{
    color:#8e9aaa;
    font-size:12px;
    margin-bottom:5px;
}

.location-name{
    font-weight:700;
    font-size:15px;
}

.arrow{
    text-align:center;
    color:#4da3ff;
    font-size:22px;
    margin:3px 0;
}

.route-info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:12px;
}

.info-box{
    background:#11161d;
    border-radius:8px;
    padding:11px;
}

.info-label{
    color:#8490a0;
    font-size:11px;
}

.info-value{
    font-weight:800;
    margin-top:5px;
}

.route-note{
    margin-top:12px;
    background:#252b34;
    border-radius:8px;
    padding:10px;
    color:#c3cad3;
    font-size:13px;
}

.route-actions{
    display:flex;
    gap:7px;
    margin-top:14px;
    flex-wrap:wrap;
}

/* ==========================================
   STRANICA VOZAČA
========================================== */

.drivers-page{
    padding:25px;
    min-height:calc(100vh - 70px);
}

.drivers-page-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.drivers-page-title{
    font-size:27px;
    font-weight:800;
}

.drivers-page-subtitle{
    color:#8f9aaa;
    margin-top:5px;
}

.drivers-page-search{
    max-width:350px;
}

.drivers-table-wrap{
    width:100%;
    overflow-x:auto;
    background:#181e27;
    border:1px solid #303845;
    border-radius:13px;
}

.drivers-table{
    width:100%;
    border-collapse:collapse;
    min-width:1200px;
}

.drivers-table th{
    background:#202732;
    color:#aeb7c3;
    font-size:12px;
    text-align:left;
    padding:14px;
    border-bottom:1px solid #394352;
    white-space:nowrap;
}

.drivers-table td{
    padding:13px 14px;
    border-bottom:1px solid #303845;
    vertical-align:middle;
    font-size:13px;
}

.drivers-table tr:last-child td{
    border-bottom:0;
}

.drivers-table tbody tr:hover{
    background:#202732;
}

.driver-table-name{
    font-weight:800;
    color:white;
}

.driver-table-truck{
    font-weight:800;
    color:#4da3ff;
}

.driver-personal{
    color:#c5ccd5;
}

.driver-table-actions{
    display:flex;
    gap:5px;
}

.driver-table-actions .btn{
    padding:7px 10px;
    font-size:12px;
}

.no-drivers{
    padding:60px 20px;
    text-align:center;
    color:#778292;
    font-size:17px;
}

/* ==========================================
   MODAL
========================================== */

.modal-bg{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:1000;
    padding:20px;
}

.modal{
    width:min(800px,100%);
    max-height:92vh;
    overflow-y:auto;
    background:#181e27;
    border:1px solid #394352;
    border-radius:14px;
}

.modal-head{
    padding:18px 20px;
    border-bottom:1px solid #303845;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modal-title{
    font-size:20px;
    font-weight:800;
}

.modal-body{
    padding:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:13px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.form-group.full{
    grid-column:1/-1;
}

label{
    font-size:13px;
    color:#a8b1bd;
    font-weight:700;
}

input,select,textarea{
    width:100%;
    background:#0f141b;
    color:white;
    border:1px solid #394352;
    border-radius:8px;
    padding:11px;
    outline:none;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#1677ff;
}

textarea{
    min-height:80px;
    resize:vertical;
}

.km-row{
    display:grid;
    grid-template-columns:1fr auto;
    gap:8px;
}

.km-result{
    margin-top:8px;
    padding:10px;
    background:#10251b;
    border:1px solid #246b45;
    color:#8ef0b6;
    border-radius:8px;
    display:none;
}

.loading{
    display:none;
    margin-top:8px;
    color:#70b5ff;
    font-size:13px;
}

.error{
    display:none;
    margin-top:8px;
    padding:10px;
    background:#3a1717;
    border:1px solid #773535;
    color:#ffaaaa;
    border-radius:8px;
    font-size:13px;
}

.small{
    color:#788595;
    font-size:11px;
}

.modal-footer{
    padding:16px 20px;
    border-top:1px solid #303845;
    display:flex;
    justify-content:flex-end;
    gap:8px;
}

/* ==========================================
   SUCCESS
========================================== */

.success-message{
    position:fixed;
    right:20px;
    bottom:20px;
    background:#159957;
    color:white;
    padding:14px 18px;
    border-radius:10px;
    font-weight:700;
    display:none;
    z-index:2000;
}

/* ==========================================
   AUTOCOMPLETE
========================================== */

.autocomplete-wrap{
    position:relative;
}

.autocomplete-list{
    position:absolute;
    left:0;
    right:0;
    top:100%;
    margin-top:3px;
    background:#181e27;
    border:1px solid #394352;
    border-radius:8px;
    overflow:hidden;
    z-index:3000;
    display:none;
    box-shadow:0 8px 20px rgba(0,0,0,.45);
}

.autocomplete-item{
    padding:10px 12px;
    cursor:pointer;
    border-bottom:1px solid #303845;
    background:#181e27;
}

.autocomplete-item:last-child{
    border-bottom:0;
}

.autocomplete-item:hover{
    background:#27303d;
}

.autocomplete-city{
    color:white;
    font-weight:700;
    font-size:14px;
}

.autocomplete-country{
    color:#8f9aaa;
    font-size:11px;
    margin-top:3px;
}

.autocomplete-loading{
    padding:10px 12px;
    color:#70b5ff;
    font-size:12px;
}

/* ==========================================
   RESPONSIVE
========================================== */

@media(max-width:900px){

    .layout{
        grid-template-columns:1fr;
    }

    .sidebar{
        border-right:0;
        border-bottom:1px solid #303845;
        max-height:330px;
        overflow:auto;
    }

    .route-grid{
        grid-template-columns:1fr;
    }
}

@media(max-width:600px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

    .topbar{
        height:auto;
        flex-wrap:wrap;
        padding:10px;
    }

    .logo{
        font-size:18px;
    }

    .main,
    .drivers-page{
        padding:12px;
    }

    .route-grid{
        grid-template-columns:1fr;
    }

    .selected-header{
        align-items:flex-start;
        flex-direction:column;
    }

    .drivers-page-title{
        font-size:22px;
    }
}
</style>
</head>

<body>

<!-- ==========================================
     TOPBAR
========================================== -->

<div class="topbar">

    <div class="logo">
        BANE <span>ROUTE PLANNER V2</span>
    </div>

    <div class="top-actions">

        <button
            id="routesPageBtn"
            class="btn btn-blue"
            onclick="showPage('routes')"
        >
            🚛 Rute
        </button>

        <button
            id="driversPageBtn"
            class="btn"
            onclick="showPage('drivers')"
        >
            👤 Vozači
        </button>

        <button
            class="btn btn-blue"
            onclick="openDriverModal()"
        >
            + Vozač
        </button>

        <button
            class="btn"
            onclick="newRoute()"
        >
            + Nova ruta
        </button>

        <button
            class="btn btn-green"
            onclick="saveMyPlan()"
        >
            💾 Sačuvaj moj plan
        </button>

        <button
            class="btn"
            onclick="exportData()"
        >
            Backup
        </button>

        <button
            class="btn"
            onclick="document.getElementById('importFile').click()"
        >
            Uvezi
        </button>

        <input
            id="importFile"
            type="file"
            accept=".json"
            style="display:none"
            onchange="importData(event)"
        >

    </div>

</div>

<!-- ==========================================
     STRANICA 1 - RUTE
========================================== -->

<div id="routePage" class="page active">

    <div class="layout">

        <aside class="sidebar">

            <div class="sidebar-header">

                <div class="sidebar-title">
                    VOZAČI / KAMIONI
                </div>

                <input
                    id="driverSearch"
                    class="search"
                    placeholder="Pretraži vozača ili kamion..."
                    oninput="renderDrivers()"
                >

            </div>

            <div
                id="driverList"
                class="driver-list"
            ></div>

        </aside>

        <main class="main">

            <div
                id="mainContent"
                class="empty"
            >

                <div>

                    <div style="font-size:45px;margin-bottom:15px;">
                        🚛
                    </div>

                    <div>
                        Izaberi vozača sa leve strane
                    </div>

                    <div style="font-size:13px;margin-top:8px;color:#667180;">
                        Zatim dodaj njegove rute.
                    </div>

                </div>

            </div>

        </main>

    </div>

</div>

<!-- ==========================================
     STRANICA 2 - VOZAČI
========================================== -->

<div
    id="driversPage"
    class="page"
>

    <div class="drivers-page">

        <div class="drivers-page-header">

            <div>

                <div class="drivers-page-title">
                    👤 SVI VOZAČI
                </div>

                <div class="drivers-page-subtitle">
                    Pregled vozača, kamiona i ličnih podataka
                </div>

            </div>

            <input
                id="driversPageSearch"
                class="search drivers-page-search"
                placeholder="🔎 Pretraži vozača, kamion, telefon..."
                oninput="renderDriversPage()"
            >

        </div>

        <div
            id="driversPageContent"
            class="drivers-table-wrap"
        ></div>

    </div>

</div>

<!-- ==========================================
     SUCCESS
========================================== -->

<div
    id="successMessage"
    class="success-message"
>
    ✓ Ruta je uspešno sačuvana
</div>

<!-- ==========================================
     MODAL VOZAČ
========================================== -->

<div
    id="driverModal"
    class="modal-bg"
>

    <div class="modal">

        <div class="modal-head">

            <div
                class="modal-title"
                id="driverModalTitle"
            >
                Novi vozač / kamion
            </div>

            <button
                class="btn"
                onclick="closeDriverModal()"
            >
                ✕
            </button>

        </div>

        <div class="modal-body">

            <div class="form-grid">

                <div class="form-group">

                    <label>
                        Broj kamiona
                    </label>

                    <input
                        id="driverTruck"
                        placeholder="S54"
                    >

                </div>

                <div class="form-group">

                    <label>
                        Ime i prezime vozača
                    </label>

                    <input
                        id="driverName"
                        placeholder="Marko Petković"
                    >

                </div>

                <div class="form-group">

                    <label>
                        Status vozača
                    </label>

                    <select
                        id="driverStatus"
                        class="status-select"
                    >

                        <option value="Vozi">
                            🟢 Vozi
                        </option>

                        <option value="Čeka utovar">
                            🟡 Čeka utovar
                        </option>

                        <option value="Na utovaru">
                            🔵 Na utovaru
                        </option>

                        <option value="Na istovaru">
                            🟠 Na istovaru
                        </option>

                        <option value="Pauza">
                            🔴 Pauza
                        </option>

                        <option value="Slobodan">
                            ⚫ Slobodan
                        </option>

                        <option value="Godišnji">
                            🟣 Godišnji
                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label>
                        Telefon
                    </label>

                    <input
                        id="driverPhone"
                        type="tel"
                        placeholder="+381 60 123 456"
                    >

                </div>

                <div class="form-group">

                    <label>
                        Datum rođenja
                    </label>

                    <input
                        id="driverBirthDate"
                        type="text"
                        placeholder="DD.MM.GGGG"
                        maxlength="10"
                        inputmode="numeric"
                    >

                </div>

                <div class="form-group">

                    <label>
                        Broj vozačke dozvole
                    </label>

                    <input
                        id="driverLicense"
                        placeholder="Broj vozačke dozvole"
                    >

                </div>

                <div class="form-group">

                    <label>
                        Istek vozačke dozvole
                    </label>

                    <input
                        id="driverLicenseExpiry"
                        type="text"
                        placeholder="DD.MM.GGGG"
                        maxlength="10"
                        inputmode="numeric"
                    >

                </div>

                <div class="form-group full">

                    <label>
                        Adresa
                    </label>

                    <input
                        id="driverAddress"
                        placeholder="Adresa stanovanja"
                    >

                </div>

                <div class="form-group full">

                    <label>
                        Tekst / napomena za vozača
                    </label>

                    <textarea
                        id="driverNote"
                        placeholder="Ovde možeš dodati tekst za vozača..."
                    ></textarea>

                </div>

            </div>

        </div>

        <div class="modal-footer">

            <button
                class="btn"
                onclick="closeDriverModal()"
            >
                Otkaži
            </button>

            <button
                class="btn btn-blue"
                onclick="saveDriver()"
            >
                Sačuvaj
            </button>

        </div>

    </div>

</div>

<!-- ==========================================
     MODAL NOVA RUTA
========================================== -->

<div
    id="routeModal"
    class="modal-bg"
>

    <div class="modal">

        <div class="modal-head">

            <div
                class="modal-title"
                id="routeModalTitle"
            >
                Nova ruta
            </div>

            <button
                class="btn"
                onclick="closeRouteModal()"
            >
                ✕
            </button>

        </div>

        <div class="modal-body">

            <div class="form-grid">

                <div class="form-group full">

                    <label>
                        Mesto polaska
                    </label>

                    <div class="autocomplete-wrap">

                        <input
                            id="routeFrom"
                            placeholder="Kecskemét, Hungary"
                            autocomplete="off"
                        >

                        <div
                            id="routeFromSuggestions"
                            class="autocomplete-list"
                        ></div>

                    </div>

                </div>

                <div class="form-group full">

                    <label>
                        Mesto dolaska
                    </label>

                    <div class="autocomplete-wrap">

                        <input
                            id="routeTo"
                            placeholder="Zeebrugge, Belgium"
                            autocomplete="off"
                        >

                        <div
                            id="routeToSuggestions"
                            class="autocomplete-list"
                        ></div>

                    </div>

                </div>

                <div class="form-group full">

                    <label>
                        Kilometraža
                    </label>

                    <div class="km-row">

                        <input
                            id="routeKm"
                            type="number"
                            min="1"
                            placeholder="KM"
                        >

                        <button
                            class="btn btn-green"
                            onclick="calculateRouteDistance()"
                        >
                            🚛 Izračunaj KM
                        </button>

                    </div>

                    <div
                        id="routeLoading"
                        class="loading"
                    >
                        ⏳ Računam kilometražu...
                    </div>

                    <div
                        id="routeKmResult"
                        class="km-result"
                    ></div>

                    <div
                        id="routeError"
                        class="error"
                    ></div>

                </div>

                <div class="form-group">

                    <label>
                        Prosečna brzina KM/H
                    </label>

                    <input
                        id="routeSpeed"
                        type="number"
                        value="80"
                        min="1"
                    >

/* ==========================================
   STRANICE

function showPage(page){

/* ==========================================
   UČITAVANJE
========================================== */

function migrateDriver(driver){

    if(!driver.status){
        driver.status = "Slobodan";
    }

    if(!("phone" in driver)){
        driver.phone = "";
    }

    if(!("address" in driver)){
        driver.address = "";
    }

    if(!("birthDate" in driver)){
        driver.birthDate = "";
    }

    if(!("license" in driver)){
        driver.license = "";
    }

    if(!("licenseExpiry" in driver)){
        driver.licenseExpiry = "";
    }

    if(!("note" in driver)){
        driver.note = "";
    }

    if(!Array.isArray(driver.routes)){
        driver.routes = [];
    }

}


function loadData(){

    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );

    if(!saved){
        return;
    }

    try{

        const parsed =
            JSON.parse(saved);

        if(
            parsed &&
            Array.isArray(parsed.drivers)
        ){

            data = parsed;

            data.drivers.forEach(
                migrateDriver
            );

        }

    }
    catch(error){

        console.log(
            "Greška pri učitavanju:",
            error
        );

    }

}


/* ==========================================
   ČUVANJE
========================================== */

function saveData(){

    try{

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(data)
        );

        return true;

    }
    catch(error){

        console.error(error);

        alert(
            "Greška! Podaci nisu mogli da se sačuvaju."
        );

        return false;

    }

}


/* ==========================================
   ID
========================================== */

function uid(){

    return Date.now().toString(36)
        +
        Math.random()
        .toString(36)
        .substring(2,10);

}


/* ==========================================
   DATUM / VREME
========================================== */

function todayEU(){

    const d =
        new Date();

    return String(
        d.getDate()
    ).padStart(2,"0")
        +
        "."
        +
        String(
            d.getMonth()+1
        ).padStart(2,"0")
        +
        "."
        +
        d.getFullYear();

}


function currentTimeEU(){

    const d =
        new Date();

    return String(
        d.getHours()
    ).padStart(2,"0")
        +
        ":" +
        String(
            d.getMinutes()
        ).padStart(2,"0");

}


function parseEuropeanDateTime(
    dateText,
    timeText
){

    const dp =
        String(dateText)
        .trim()
        .split(".");

    const tp =
        String(timeText)
        .trim()
        .split(":");

    if(
        dp.length !== 3 ||
        tp.length !== 2
    ){
        return null;
    }

    const day = Number(dp[0]);
    const month = Number(dp[1]);
    const year = Number(dp[2]);
    const hour = Number(tp[0]);
    const minute = Number(tp[1]);

    if(
        !Number.isInteger(day) ||
        !Number.isInteger(month) ||
        !Number.isInteger(year) ||
        !Number.isInteger(hour) ||
        !Number.isInteger(minute)
    ){
        return null;
    }

    if(
        day < 1 ||
        day > 31 ||
        month < 1 ||
        month > 12 ||
        year < 2000 ||
        year > 2100 ||
        hour < 0 ||
        hour > 23 ||
        minute < 0 ||
        minute > 59
    ){
        return null;
    }

    const d =
        new Date(
            year,
            month - 1,
            day,
            hour,
            minute,
            0
        );

    if(
        d.getFullYear() !== year ||
        d.getMonth() !== month - 1 ||
        d.getDate() !== day ||
        d.getHours() !== hour ||
        d.getMinutes() !== minute
    ){
        return null;
    }

    return d;

}


function formatDateEU(value){

    const d =
        new Date(value);

    if(
        isNaN(d.getTime())
    ){
        return "-";
    }

    return String(
        d.getDate()
    ).padStart(2,"0")
        +
        "."
        +
        String(
            d.getMonth()+1
        ).padStart(2,"0")
        +
        "."
        +
        d.getFullYear();

}


function formatTimeEU(value){

    const d =
        new Date(value);

    if(
        isNaN(d.getTime())
    ){
        return "-";
    }

    return String(
        d.getHours()
    ).padStart(2,"0")
        +
        ":" +
        String(
            d.getMinutes()
    ).padStart(2,"0");

}


function formatDateTimeEU(value){

    return formatDateEU(value)
        +
        " "
        +
        formatTimeEU(value);

}

}

        );

        driver.address =
            address;

        driver.birthDate =

        driver.note =
            note;

        if(saveData()){

            closeDriverModal();

            renderDrivers();

            renderMain();

            renderDriversPage();

        return;

    }

    const driver = {

        phone:phone,

        address:address,

        birthDate:birthDate,

        license:license,

        note:note,

        routes:[]

    };

    data.drivers.push(

    );

    data.selectedDriverId =
        driver.id;

    if(saveData()){

        closeDriverModal();

        renderDrivers();

        renderMain();

        renderDriversPage();

    }

}


/* ==========================================

========================================== */

function deleteDriver(id){

    const driver =
        data.drivers.find(
            d => d.id === id
        );

    if(!driver){
        return;
    }

    const routeCount =
        Array.isArray(driver.routes)
        ?
        driver.routes.length
        :
        0;

    let message =
        "DA LI SIGURNO ŽELIŠ DA OBRIŠEŠ VOZAČA?\n\n"
        +
        "Vozač: "
        +
        driver.name
        +
        "\n"
        +
        "Kamion: "
        +
        driver.truck
        +
        "\n\n";

    if(routeCount > 0){

        message +=
            "PAŽNJA!\n"
            +
            "Ovaj vozač ima "
            +
            routeCount
            +
            " ruta.\n"
            +
            "Brisanjem vozača biće obrisane i njegove rute.\n\n";

    }

    message +=
        "Ova radnja se ne može poništiti.";

    if(
        !confirm(message)
    ){
        return;
    }

    data.drivers =
        data.drivers.filter(
            d => d.id !== id
        );

    if(
        data.selectedDriverId === id
    ){

        data.selectedDriverId =
            data.drivers.length > 0
            ?
            data.drivers[0].id
            :
            null;

    }

    saveData();

    renderDrivers();

    renderMain();

    renderDriversPage();

}

        </div>

        ${
            driver.routes.length === 0
            ?
            `

            <div class="empty">

                <div>

                    <div style="font-size:50px;">
                        🗺️
                    </div>

                    <div style="margin-top:12px;">
                        Ovaj vozač nema nijednu rutu.
                    </div>

                    <button
                        class="btn btn-blue"
                        style="margin-top:18px;"
                        onclick="newRoute()"
                    >
                        + Dodaj prvu rutu
                    </button>

                </div>

            </div>

            `
            :
            `

            <div class="route-grid">

                ${
                    driver.routes
                    .slice()
                    .reverse()
                    .map(
                        route =>
                            createRouteCard(route)
                    )
                    .join("")
                }

            </div>

            `
        }

    `;

    addRouteButtonEvents();

}


/* ==========================================

        ?
        "status-toku"

        ?
        "status-problem"
        :

        ?
        "status-zavrsen"
        :
        "status-planiran";

    const eta =
        calculateETA(
            new Date(route.departure),
            Number(route.km),
            Number(route.speed),
            Number(route.daily)
        );

    const clean =
        Number(route.km) /
        Number(route.speed);

    return `

        <div class="route-card">

            <div class="route-head">

                        ${escapeHtml(route.to)}

                            🛣️ KILOMETRAŽA
                        </div>

                        <div class="info-value">
                            ${Number(route.km).toLocaleString("sr-RS")} km
                        </div>

                    </div>

                    <div class="info-box">

                        <div class="info-label">
                            🚚 BRZINA
                        </div>

                        <div class="info-value">
                            ${route.speed} km/h
                        </div>

                    </div>

                    <div class="info-box">

                        <div class="info-label">
                            🕐 POLAZAK
                        </div>

                        <div class="info-value">
                            ${formatDateTimeEU(route.departure)}
                        </div>

                    </div>

                    <div class="info-box">

                        <div class="info-label">

                        </div>

                    </div>

                    <div class="info-box">

                        data-id="${route.id}"

function addRouteButtonEvents(){

    document
        .querySelectorAll("[data-action]")
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    function(){

                        const action =
                            this.dataset.action;

                        const id =
                            this.dataset.id;

                        if(action === "edit"){
                            editRoute(id);
                        }

                        if(action === "copy"){
                            copyRoute(id);
                        }

                        if(action === "maps"){
                            openMapsById(id);
                        }

                        if(action === "delete"){
                            deleteRoute(id);
                        }

                    }
                );

            }
        );

}

========================================== */

function saveRoute(){

    const driver =
        getSelectedDriver();

    if(!driver){

        alert(
            "Nije izabran vozač."
        );

        return;

    }

    migrateDriver(driver);

    const from =
        document.getElementById(
            "routeFrom"
        )
        .value
        .trim();

    const to =
        document.getElementById(
            "routeTo"
        )
        .value
        .trim();

    const km =
        Number(
            document.getElementById(
                "routeKm"
            ).value
        );

    const speed =
        Number(
            document.getElementById(
                "routeSpeed"
            ).value
        );

    const daily =
        Number(
            document.getElementById(
                "routeDaily"
            ).value
        );

    const date =
        document.getElementById(
            "routeDate"
        )
        .value
        .trim();

    const time =
        document.getElementById(
            "routeTime"
        )
        .value
        .trim();

    const status =
        document.getElementById(
            "routeStatus"
        ).value;

    const note =
        document.getElementById(
            "routeNote"
        )
        .value
        .trim();

    if(!from){

        alert(
            "Unesi mesto polaska."
        );

        return;

    }

    if(!to){

        alert(
            "Unesi mesto dolaska."
        );

        return;

    }

    if(!km || km <= 0){

        alert(
            "Unesi ili izračunaj KM."
        );

        return;

    }

    if(!speed || speed <= 0){

        alert(
            "Unesi ispravnu brzinu."
        );

        return;

    }

    if(!daily || daily <= 0){

        alert(
            "Unesi dnevnu vožnju."
        );

        return;

    }

    const departure =
        parseEuropeanDateTime(
            date,
            time
        );

    if(!departure){

        alert(
            "Datum ili vreme nisu ispravni.\n\n"
            +
            "Datum mora biti DD.MM.YYYY\n"
            +
            "Vreme mora biti HH:MM"
        );

        return;

    }

    if(editingRouteId){

        const index =
            driver.routes.findIndex(
                route =>
                    route.id ===
                    editingRouteId
            );

        if(index === -1){

            alert(
                "Ruta nije pronađena."
            );

            return;

        }

        driver.routes[index] = {

            ...driver.routes[index],

            from:from,
            to:to,
            km:km,
            speed:speed,
            daily:daily,
            departure:departure.toISOString(),
            status:status,
            note:note

        };

    }
    else{

        driver.routes.push({

            id:uid(),

            from:from,
            to:to,
            km:km,
            speed:speed,
            daily:daily,
            departure:departure.toISOString(),
            status:status,
            note:note

        });

    }

    if(!saveData()){
        return;
    }

    closeRouteModal();

    renderDrivers();

    renderMain();

    renderDriversPage();

    showSuccess();

}


function showSuccess(){

    const message =
        document.getElementById(
            "successMessage"
        );

    message.style.display =
        "block";

    setTimeout(
        function(){

            message.style.display =
                "none";

        },
        2500
    );

}

        driver.routes.find(
            r => r.id === id
        );

function copyRoute(id){

    const driver =
        getSelectedDriver();

    if(!driver){
        return;
    }

    const route =
        driver.routes.find(
            r => r.id === id
        );

    if(!route){
        return;
    }

    const eta =
        calculateETA(
            new Date(route.departure),
            route.km,
            route.speed,
            route.daily
        );

    const text =

`🚛 RUTA
Kamion: ${driver.truck}
Vozač: ${driver.name}

📍 POLAZAK:
${route.from}

🏁 DOLAZAK:
${route.to}

🛣️ KM: ${route.km} km
🚚 Brzina: ${route.speed} km/h

🕐 Polazak:
${formatDateTimeEU(route.departure)}

🏁 Predviđen dolazak:
${formatDateTimeEU(eta)}

📝 Napomena:
${route.note || "-"}`;

    if(
        navigator.clipboard &&
        navigator.clipboard.writeText
    ){

        navigator.clipboard.writeText(
            text
        )
        .then(
            function(){

                alert(
                    "Ruta je kopirana."
                );

            }
        )
        .catch(
            function(){

                fallbackCopy(text);

            }
        );

    }
    else{

        fallbackCopy(text);

    }

}


function fallbackCopy(text){

    const textarea =
        document.createElement(
            "textarea"
        );

    textarea.value =
        text;

    document.body.appendChild(
        textarea
    );

    textarea.select();

    document.execCommand(
        "copy"
    );

    textarea.remove();

    alert(
        "Ruta je kopirana."
    );

}

/* ==========================================
   AUTOCOMPLETE
========================================== */

let autocompleteTimers = {};
let autocompleteControllers = {};

function setupAutocomplete(
    inputId,
    listId
){

    const input =
        document.getElementById(inputId);

    const list =
        document.getElementById(listId);

    if(!input || !list){
        return;
    }

    input.addEventListener(
        "input",
        function(){

            const value =
                this.value.trim();

            clearTimeout(
                autocompleteTimers[inputId]
            );

            if(value.length < 3){

                hideAutocompleteList(list);

                return;

            }

            autocompleteTimers[inputId] =
                setTimeout(
                    function(){

                        searchCities(
                            value,
                            input,
                            list
                        );

                    },
                    350
                );

        }
    );

    input.addEventListener(
        "focus",
        function(){

            const value =
                this.value.trim();

            if(value.length >= 3){

                searchCities(
                    value,
                    input,
                    list
                );

            }

        }
    );

    input.addEventListener(
        "keydown",
        function(event){

            if(event.key === "Escape"){

                hideAutocompleteList(list);

            }

        }
    );

}


async function searchCities(
    query,
    input,
    list
){

    const inputId =
        input.id;

    if(
        autocompleteControllers[inputId]
    ){

        autocompleteControllers[inputId].abort();

    }

    const controller =
        new AbortController();

    autocompleteControllers[inputId] =
        controller;

    list.style.display =
        "block";

    list.innerHTML = `
        <div class="autocomplete-loading">
            ⏳ Tražim gradove...
        </div>
    `;

    try{

        const url =
            "https://photon.komoot.io/api/?q="
            +
            encodeURIComponent(query)
            +
            "&limit=8";

        const response =
            await fetch(
                url,
                {
                    signal:
                        controller.signal
                }
            );

        if(!response.ok){

            throw new Error(
                "Greška pri pretrazi."
            );

        }

        const json =
            await response.json();

        if(
            !json.features ||
            !json.features.length
        ){

            list.innerHTML = `
                <div class="autocomplete-loading">
                    Nema pronađenih gradova.
                </div>
            `;

            return;

        }

        const results =
            json.features
            .map(
                feature => {

                    const properties =
                        feature.properties || {};

                    const city =
                        properties.city
                        ||
                        properties.name
                        ||
                        properties.town
                        ||
                        properties.village
                        ||
                        "";

                    const state =
                        properties.state || "";

                    const country =
                        properties.country || "";

                    if(!city){
                        return null;
                    }

                    return {
                        city,
                        state,
                        country
                    };

                }
            )
            .filter(Boolean);

        const unique = [];
        const seen = new Set();

        results.forEach(
            item => {

                const key =
                    (
                        item.city
                        +
                        "|"
                        +
                        item.state
                        +
                        "|"
                        +
                        item.country
                    )
                    .toLowerCase();

                if(!seen.has(key)){

                    seen.add(key);

                    unique.push(item);

                }

            }
        );

        if(unique.length === 0){

            list.innerHTML = `
                <div class="autocomplete-loading">
                    Nema pronađenih gradova.
                </div>
            `;

            return;

        }

        list.innerHTML =
            unique
            .slice(0,8)
            .map(
                item => {

                    const city =
                        escapeHtml(item.city);

                    const locationParts = [];

                    if(item.state){
                        locationParts.push(
                            item.state
                        );
                    }

                    if(item.country){
                        locationParts.push(
                            item.country
                        );
                    }

                    const location =
                        escapeHtml(
                            locationParts.join(", ")
                        );

                    return `

                        <div
                            class="autocomplete-item"
                            data-city="${city}"
                            data-location="${location}"
                        >

                            <div class="autocomplete-city">
                                📍 ${city}
                            </div>

                            ${
                                location
                                ?
                                `
                                <div class="autocomplete-country">
                                    ${location}
                                </div>
                                `
                                :
                                ""
                            }

                        </div>

                    `;

                }
            )
            .join("");

        list
        .querySelectorAll(".autocomplete-item")
        .forEach(
            item => {

                item.addEventListener(
                    "mousedown",
                    function(event){

                        event.preventDefault();

                        const city =
                            this.dataset.city;

                        const location =
                            this.dataset.location;

                        if(location){

                            input.value =
                                city +
                                ", " +
                                location;

                        }
                        else{

                            input.value =
                                city;

                        }

                        hideAutocompleteList(list);

                        input.dispatchEvent(
                            new Event(
                                "change",
                                {
                                    bubbles:true
                                }
                            )
                        );

                    }
                );

            }
        );

    }
    catch(error){

        if(
            error.name === "AbortError"
        ){
            return;
        }

        list.innerHTML = `
            <div class="autocomplete-loading">
                ⚠️ Nije moguće učitati predloge.
            </div>
        `;

    }

}


function hideAutocompleteList(list){

    if(list){

        list.style.display =
            "none";

        list.innerHTML =
            "";

    }

}


function hideAllAutocomplete(){

    hideAutocompleteList(
        document.getElementById(
            "routeFromSuggestions"
        )
    );

    hideAutocompleteList(
        document.getElementById(
            "routeToSuggestions"
        )
    );

}


document.addEventListener(
    "click",
    function(event){

        const fromWrap =
            document.getElementById(
                "routeFrom"
            );

        const toWrap =
            document.getElementById(

        if(

                )
            );

        }

    }
);


/* ==========================================
   AUTOMATSKI KM
========================================== */

async function geocodePlace(place){

    const url =
        "https://photon.komoot.io/api/?q="
        +
        encodeURIComponent(place)
        +
        "&limit=1";

    const response =
        await fetch(url);

    if(!response.ok){

        throw new Error(
            "Servis za pronalaženje mesta nije dostupan."
        );

    }

    const json =
        await response.json();

    if(
        !json.features ||
        !json.features.length
    ){

        throw new Error(
            'Mesto nije pronađeno: "' +
            place +
            '"'
        );

    }

    const feature =
        json.features[0];

    const coordinates =
        feature.geometry.coordinates;

    return {

        lon:Number(coordinates[0]),

        lat:Number(coordinates[1]),

        label:
            feature.properties.name ||
            place

    };

}


async function calculateRouteDistance(){

    const from =
        document.getElementById(
            "routeFrom"
        )
        .value
        .trim();

    const to =
        document.getElementById(
            "routeTo"
        )
        .value
        .trim();

    if(!from || !to){

        showDistanceError(
            "Prvo unesi polazak i dolazak."
        );

        return;

    }

    clearDistanceMessages();

    document.getElementById(
        "routeLoading"
    ).style.display =
        "block";

    try{

        const start =
            await geocodePlace(from);

        await wait(1000);

        const end =
            await geocodePlace(to);

        await wait(1000);

        const url =
            "https://router.project-osrm.org/route/v1/driving/"
            +
            start.lon
            +
            ","
            +
            start.lat
            +
            ";"
            +
            end.lon
            +
            ","
            +
            end.lat
            +
            "?overview=false&alternatives=false";

        const response =
            await fetch(url);

        if(!response.ok){

            throw new Error(
                "Servis za izračunavanje KM nije dostupan."
            );

        }

        const json =
            await response.json();

        if(
            json.code !== "Ok" ||
            !json.routes ||
            !json.routes.length
        ){

            throw new Error(
                "Ruta nije pronađena."
            );

        }

        const distance =
            Math.round(
                json.routes[0].distance / 1000
            );

        document.getElementById(
            "routeKm"
        ).value =
            distance;

        const result =
            document.getElementById(
                "routeKmResult"
            );

        result.innerHTML =
            "✓ Izračunato: <strong>" +
            distance +
            " km</strong>";

        result.style.display =
            "block";

    }
    catch(error){

        showDistanceError(
            error.message ||
            "Greška pri izračunavanju KM."
        );

    }
    finally{

        document.getElementById(
            "routeLoading"
        ).style.display =
            "none";

    }

}


function wait(ms){

    return new Promise(
        resolve =>
            setTimeout(resolve,ms)
    );

}


function clearDistanceMessages(){

    document.getElementById(
        "routeLoading"
    ).style.display =
        "none";

    document.getElementById(
        "routeKmResult"
    ).style.display =
        "none";

    document.getElementById(
        "routeError"
    ).style.display =
        "none";

}


function showDistanceError(message){

    const error =
        document.getElementById(
            "routeError"
        );

    error.textContent =
        "⚠️ " + message;

    error.style.display =
        "block";

}


/* ==========================================
   ETA
========================================== */

function calculateETA(
    departure,
    km,
    speed,
    daily
){

    let remaining =
        Number(km) /
        Number(speed);

    let current =
        new Date(departure);

    const dailyHours =
        Number(daily);

    while(
        remaining >
        dailyHours
    ){

        current =
            new Date(
                current.getTime()
                +
                dailyHours *
                3600000
            );

        remaining -=
            dailyHours;

        current =
            new Date(
                current.getTime()
                +
                11 *
                3600000
            );

    }

    current =
        new Date(
            current.getTime()
            +
            remaining *
            3600000
        );

    return current;

}


function formatHours(hours){

    if(!isFinite(hours)){
        return "-";
    }

    const h =
        Math.floor(hours);

    const m =
        Math.round(
            (hours - h) * 60
        );

    if(h === 0){

        return m + " min";

    }

    return h +
        " h " +
        m +
        " min";

}

function importData(event){

    const file =
        event.target.files[0];

    if(!file){
        return;
    }

    const reader =
        new FileReader();

    reader.onload =
        function(){

            try{

                const imported =
                    JSON.parse(
                        reader.result
                    );

                if(
                    !imported ||
                    !Array.isArray(
                        imported.drivers
                    )
                ){

                    throw new Error();

                }

                data =
                    imported;

                data.drivers.forEach(
                    migrateDriver
                );

                saveData();

                renderDrivers();

                renderMain();

                renderDriversPage();

                alert(
                    "Backup je uspešno učitan."
                );

            }
            catch(error){

                alert(
                    "Backup fajl nije ispravan."
                );

            }

        };

    reader.readAsText(file);

    event.target.value = "";

}

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}
